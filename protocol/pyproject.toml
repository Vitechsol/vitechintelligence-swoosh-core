[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swoosh-contracts"
version = "0.1.0"
description = "Preview schemas and thin validation adapters; never an authorization engine"
license = { text = "Apache-2.0" }
authors = [{ name = "ViTech Intelligence Solutions" }]
requires-python = ">=3.11"
dependencies = ["jsonschema==4.25.1"]

[project.urls]
Repository = "https://github.com/vitechintelligence/vitechintelligence-swoosh-core"

[tool.setuptools.packages.find]
include = ["swoosh_contracts*"]

[tool.setuptools.package-data]
swoosh_contracts = ["schemas/v1/*.json"]
