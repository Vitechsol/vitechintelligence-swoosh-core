name: Contributor rights
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
  statuses: write
jobs:
  verify-rights:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check contributor evidence against protected registry
        env:
          CONTRIBUTION_GITHUB_TOKEN: ${{ github.token }}
          CONTRIBUTION_REPOSITORY: ${{ github.repository }}
          CONTRIBUTION_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/check-contributor-rights.py --repository "$CONTRIBUTION_REPOSITORY" --pull-request-number "$CONTRIBUTION_PR_NUMBER"
