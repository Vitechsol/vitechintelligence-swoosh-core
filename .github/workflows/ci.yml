name: Swoosh Core CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.85.0
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo check --locked -p trust-kernel --no-default-features
      - run: cargo check --locked -p trust-kernel --target wasm32-unknown-unknown --no-default-features
      - run: cargo test --locked --workspace --all-targets
      - run: cargo run --locked -p proof-pack --quiet
      - run: cargo install cargo-audit --version 0.22.1 --locked
      - run: cargo audit --deny warnings
      - run: python scripts/check-rust-provenance.py
      - name: Verify release license coverage
        run: python scripts/check-license-coverage.py
      - name: Generate Rust SPDX SBOM
        run: python scripts/generate_sbom.py cargo --output sbom/rust.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: swoosh-rust-sbom
          path: sbom/rust.spdx.json
          if-no-files-found: error
      - name: Build native conformance tools
        run: |
          cargo build --locked -p trust-console
          cargo build --locked -p proof-pack --example halibut_fixture
          mkdir -p dist/conformance-tools
          cp target/debug/trust-console dist/conformance-tools/trust-console
          cp target/debug/examples/halibut_fixture dist/conformance-tools/halibut-fixture
          strip dist/conformance-tools/trust-console dist/conformance-tools/halibut-fixture
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path('dist/conformance-tools')
          manifest = {'sourceCommit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                      'platform': 'linux-x86_64', 'purpose': 'synthetic-native-conformance',
                      'sha256': {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.iterdir())}}
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Retain native conformance tools
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: swoosh-native-conformance-tools
          path: dist/conformance-tools/
          retention-days: 7
          if-no-files-found: error

  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Create isolated protocol environment
        run: python -m venv .venv
      - name: Install protocol codec
        working-directory: protocol
        run: ../.venv/bin/python -m pip install .
      - name: Protocol conformance
        working-directory: protocol
        run: ../.venv/bin/python -m unittest discover -s tests -v
      - name: Generate protocol SPDX SBOM
        run: .venv/bin/python scripts/generate_sbom.py python --root-name swoosh-contracts --output sbom/protocol.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: swoosh-protocol-sbom
          path: sbom/protocol.spdx.json
          if-no-files-found: error
